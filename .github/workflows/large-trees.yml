name: Large trees

# The parity of the stateful sets with a tree of height 20 or more, which `parity run` skips
# without `--large-trees`. A key pair of such a set takes from minutes to hours on each side,
# so each set is a job of its own. A push to a branch under `large-trees/` runs them on any
# commit. The four LMS sets of height 25 take longer than the six hours of a hosted job and
# run on a machine of their own, as Documentation/Architecture/Parity.md says.
on:
  push:
    branches: ['large-trees/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: large-trees-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The one build of the C oracle and of the release parity program. The jobs after it take
    # the oracle from the cache that this job fills and the program from its artifact, so no
    # shard builds either of them again.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Restore the C oracle
        id: oracle
        uses: actions/cache@v6
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
      - name: Build the C oracle
        # fetch-oracle runs CMake again on a present build, which compiles the library again.
        # A cache hit holds the whole oracle of the key, the vectors among them.
        if: steps.oracle.outputs.cache-hit != 'true'
        run: cargo xtask fetch-oracle
      - name: Build the parity program
        run: cargo build --release --locked -p oqs-native-parity
      - name: Keep the parity program
        uses: actions/upload-artifact@v7
        with:
          name: parity
          path: target/release/parity
          retention-days: 1

  parity:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        set:
          - LMS_SHA256_H20_W1
          - LMS_SHA256_H20_W2
          - LMS_SHA256_H20_W4
          - LMS_SHA256_H20_W8
          - LMS_SHA256_H20_W8_H10_W8
          - LMS_SHA256_H20_W8_H15_W8
          - LMS_SHA256_H20_W8_H20_W8
          - LMS_SHA256_H20_W8_H5_W8
          - XMSS-SHA2_20_192
          - XMSS-SHA2_20_256
          - XMSS-SHA2_20_512
          - XMSS-SHAKE256_20_192
          - XMSS-SHAKE256_20_256
          - XMSS-SHAKE_20_256
          - XMSS-SHAKE_20_512
          - XMSSMT-SHA2_40/2_256
          - XMSSMT-SHA2_60/3_256
          - XMSSMT-SHAKE_40/2_256
          - XMSSMT-SHAKE_60/3_256
    steps:
      - name: Fetch the parity program of the build job
        uses: actions/download-artifact@v8
        with:
          name: parity
      - name: Make the parity program executable
        run: chmod +x parity
      - name: Parity with 1000 variations of the set
        run: ./parity run --cases 1000 --large-trees --only "${{ matrix.set }}"

  passed:
    # The one result of the gate, which joins the shards in the graph of a run. It fails when
    # any shard failed or was cancelled.
    needs: [build, parity]
    if: always()
    permissions:
      actions: write
    runs-on: ubuntu-26.04
    steps:
      - name: A job failed, was cancelled or did not run
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Every set passed
        run: echo "every set of the run passed"
      - name: Delete the artifacts of the run
        # The jobs of the run have read them. A run with a failed job keeps them until their
        # retention ends, so a re-run of its failed jobs still finds them. A token that cannot
        # delete, as in a pull request from a fork, leaves them to their retention.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id' |
            while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              echo "deleted artifact $id"
            done

name: Check for liboqs updates

# Compares LIBOQS_VERSION with the latest liboqs release. A newer release opens
# one issue for the pinned version, or updates the open issue that the Actions
# app opened for that pin. A closed issue from that app with the same title is
# not opened again. An issue from anyone else is left as it is.
on:
  schedule:
    # Every Monday at 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: update-liboqs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare the pinned version with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Tools/check-liboqs-update.sh

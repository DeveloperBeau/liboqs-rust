name: CI

on:
  # Every pull request, so a pull request stacked on another one also runs the checks.
  pull_request:
  push:
    branches: [release, develop]

permissions:
  contents: read

jobs:
  build:
    # The one build of the C oracle and of the release parity program. The jobs after it take
    # the oracle from the cache that this job fills and the program from its artifact, so no
    # shard builds either of them again.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # A cache that the key finds is not saved again, so the key hashes every input of
      # fetch-oracle, the list of the vector files among them. Otherwise a new vector file
      # reaches this job but not the cache that the later jobs restore.
      - name: Restore the C oracle
        uses: actions/cache@v4
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
      - name: Build the C oracle
        run: cargo xtask fetch-oracle
      - name: Build the parity program
        run: cargo build --release --locked -p oqs-native-parity
      - name: Keep the parity program
        uses: actions/upload-artifact@v4
        with:
          name: parity
          path: target/release/parity
          retention-days: 1

  checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Restore the C oracle of the build job
        uses: actions/cache/restore@v4
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
          fail-on-cache-miss: true
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Build without the standard library
        run: cargo build --workspace --lib --no-default-features --locked
      - name: Build each crate alone without the standard library
        # One build unifies the features of its crates, and the tools turn on `std` in every
        # family, so only a build of one crate shows a crate that needs `std`.
        run: |
          for manifest in Modules/*/Cargo.toml; do
            cargo build --manifest-path "$manifest" --lib --no-default-features --locked
          done
      - name: Test
        run: cargo test --workspace --locked
      - name: Repository checks
        env:
          HYGIENE_WORDS: ${{ secrets.HYGIENE_WORDS }}
        run: |
          # Each word is masked, so a finding never prints a forbidden word in the public log.
          IFS=',' read -ra words <<< "$HYGIENE_WORDS"
          for word in "${words[@]}"; do
            word="$(echo "$word" | xargs)"
            if [ -n "$word" ]; then echo "::add-mask::$word"; fi
          done
          cargo xtask check
      - name: Fetch the parity program of the build job
        uses: actions/download-artifact@v4
        with:
          name: parity
      - name: Make the parity program executable
        run: chmod +x parity
      - name: Known answers of the C library through the Rust harness
        run: ./parity known-answers --all --processes 4
      - name: Snapshot of the C library
        run: ./parity snapshot --check --processes 4

  parity:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Fetch the parity program of the build job
        uses: actions/download-artifact@v4
        with:
          name: parity
      - name: Make the parity program executable
        run: chmod +x parity
      - name: Parity with 100 variations of each algorithm
        # The gate workflow runs the 1000 variations. Blocks of 10 variations spread a slow
        # algorithm over every shard and process.
        run: ./parity run --cases 100 --block-size 10 --shard ${{ matrix.shard }}/4 --processes 4

name: CI

on:
  # Every pull request, so a pull request stacked on another one also runs the checks.
  pull_request:
  push:
    branches: [release, develop]

permissions:
  contents: read

jobs:
  build:
    # The one build of the C oracle and of the release parity program. The jobs after it take
    # the oracle from the cache that this job fills and the program from its artifact, so no
    # shard builds either of them again.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # A cache that the key finds is not saved again, so the key hashes every input of
      # fetch-oracle, the list of the vector files among them. Otherwise a new vector file
      # reaches this job but not the cache that the later jobs restore.
      - name: Restore the C oracle
        id: oracle
        uses: actions/cache@v6
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
      - name: Build the C oracle
        # fetch-oracle runs CMake again on a present build, which compiles the library again.
        # A cache hit holds the whole oracle of the key, the vectors among them.
        if: steps.oracle.outputs.cache-hit != 'true'
        run: cargo xtask fetch-oracle
      - name: Build the parity program
        run: cargo build --release --locked -p oqs-native-parity
      - name: Keep the parity program
        uses: actions/upload-artifact@v7
        with:
          name: parity
          path: target/release/parity
          retention-days: 1

  # Each job below takes the oracle or the parity program of the build job, so the graph of a
  # run shows one build and the jobs that use it, and the last job joins their results.
  lint:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Restore the C oracle of the build job
        uses: actions/cache/restore@v6
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
          fail-on-cache-miss: true
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked

  no-std:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Restore the C oracle of the build job
        uses: actions/cache/restore@v6
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
          fail-on-cache-miss: true
      - name: Build without the standard library
        run: cargo build --workspace --lib --no-default-features --locked
      - name: Build each crate alone without the standard library
        # One build unifies the features of its crates, and the tools turn on `std` in every
        # family, so only a build of one crate shows a crate that needs `std`.
        run: |
          for manifest in Modules/*/Cargo.toml; do
            cargo build --manifest-path "$manifest" --lib --no-default-features --locked
          done

  test:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Restore the C oracle of the build job
        uses: actions/cache/restore@v6
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
          fail-on-cache-miss: true
      - name: Test
        run: cargo test --workspace --locked

  repository:
    # The repository checks read the files of the tree and need no oracle.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Repository checks
        env:
          HYGIENE_WORDS: ${{ secrets.HYGIENE_WORDS }}
        run: |
          # Each word is masked, so a finding never prints a forbidden word in the public log.
          IFS=',' read -ra words <<< "$HYGIENE_WORDS"
          for word in "${words[@]}"; do
            word="$(echo "$word" | xargs)"
            if [ -n "$word" ]; then echo "::add-mask::$word"; fi
          done
          cargo xtask check

  known-answers:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # The key of the cache hashes files of the tree, and the snapshot check reads the frozen
      # snapshot, so the job needs the checkout even though it runs only the built program.
      - uses: actions/checkout@v7
      - name: Restore the C oracle of the build job
        uses: actions/cache/restore@v6
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
          fail-on-cache-miss: true
      - name: Fetch the parity program of the build job
        uses: actions/download-artifact@v8
        with:
          name: parity
      - name: Make the parity program executable
        run: chmod +x parity
      - name: Known answers of the C library through the Rust harness
        run: ./parity known-answers --all --processes 4

  snapshot:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # The key of the cache hashes files of the tree, and the snapshot check reads the frozen
      # snapshot, so the job needs the checkout even though it runs only the built program.
      - uses: actions/checkout@v7
      - name: Restore the C oracle of the build job
        uses: actions/cache/restore@v6
        with:
          path: target/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('LIBOQS_VERSION', 'Tools/Xtask/src/OracleBuild.rs', 'Tools/Xtask/src/TestVector.rs', 'Documentation/Registers/TestVectors.md') }}
          fail-on-cache-miss: true
      - name: Fetch the parity program of the build job
        uses: actions/download-artifact@v8
        with:
          name: parity
      - name: Make the parity program executable
        run: chmod +x parity
      - name: Snapshot of the C library
        run: ./parity snapshot --check --processes 4

  parity:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Fetch the parity program of the build job
        uses: actions/download-artifact@v8
        with:
          name: parity
      - name: Make the parity program executable
        run: chmod +x parity
      - name: Parity with 100 variations of each algorithm
        # The gate workflow runs the 1000 variations. Blocks of 10 variations spread a slow
        # algorithm over every shard and process.
        run: ./parity run --cases 100 --block-size 10 --shard ${{ matrix.shard }}/4 --processes 4

  passed:
    # The one result of a run, for a required check of the branch rules. It fails when any
    # job failed or was cancelled.
    needs: [build, lint, no-std, test, repository, known-answers, snapshot, parity]
    if: always()
    permissions:
      actions: write
    runs-on: ubuntu-26.04
    steps:
      - name: A job failed, was cancelled or did not run
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Every job passed
        run: echo "every job of the run passed"
      - name: Delete the artifacts of the run
        # The jobs of the run have read them. A run with a failed job keeps them until their
        # retention ends, so a re-run of its failed jobs still finds them. A token that cannot
        # delete, as in a pull request from a fork, leaves them to their retention.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id' |
            while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              echo "deleted artifact $id"
            done

[package]
name = "oqs-native-bike"
description = "BIKE, the bit flipping key encapsulation, a native port of the BIKE algorithms of liboqs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The port is MIT. It translates the implementation of the BIKE team, which is Apache-2.0.
license = "MIT AND Apache-2.0"
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bike", "kem", "pqc", "post-quantum", "liboqs"]
categories.workspace = true
# The tests use the unpublished test crates, so the package leaves them out.
exclude = ["tests/"]

[package.metadata]
ring = "features"

[lib]
name = "OQSNativeBIKE"
path = "src/lib.rs"

[dependencies]
oqs-native-domain = { workspace = true }
oqs-native-entities = { workspace = true }
oqs-native-sha3 = { workspace = true }

[dev-dependencies]
oqs-native-algorithm-tests = { path = "../AlgorithmTests" }
oqs-native-kat-random = { path = "../KATRandom" }

[features]
default = ["std"]
# Without `std` the crate builds with `core` and `alloc` only.
std = ["oqs-native-domain/std", "oqs-native-entities/std", "oqs-native-sha3/std"]

[lints]
workspace = true

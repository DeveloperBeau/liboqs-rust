[package]
name = "oqs-native"
description = "A native Rust port of liboqs: every algorithm family behind one registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["post-quantum", "pqc", "kem", "signature", "liboqs"]
categories.workspace = true

[package.metadata]
ring = "composition"

[lib]
name = "OQSNative"
path = "src/lib.rs"

[dependencies]
oqs-native-bike = { workspace = true }
oqs-native-cross = { workspace = true }
oqs-native-classic-mceliece = { workspace = true }
oqs-native-domain = { workspace = true }
oqs-native-entities = { workspace = true }
oqs-native-falcon = { workspace = true }
oqs-native-frodokem = { workspace = true }
oqs-native-hqc = { workspace = true }
oqs-native-lms = { workspace = true }
oqs-native-mayo = { workspace = true }
oqs-native-ml-dsa = { workspace = true }
oqs-native-ml-kem = { workspace = true }
oqs-native-mqom = { workspace = true }
oqs-native-ntru = { workspace = true }
oqs-native-ntru-prime = { workspace = true }
oqs-native-slh-dsa = { workspace = true }
oqs-native-snova = { workspace = true }
oqs-native-system-random = { workspace = true, optional = true }
oqs-native-uov = { workspace = true }
oqs-native-xmss = { workspace = true }

[features]
default = ["std"]
# Without `std` the crate builds with `core` and `alloc` only, and has no system random source.
std = [
    "oqs-native-bike/std",
    "oqs-native-cross/std",
    "oqs-native-classic-mceliece/std",
    "oqs-native-domain/std",
    "oqs-native-entities/std",
    "oqs-native-falcon/std",
    "oqs-native-frodokem/std",
    "oqs-native-hqc/std",
    "oqs-native-lms/std",
    "oqs-native-mayo/std",
    "oqs-native-ml-dsa/std",
    "oqs-native-ml-kem/std",
    "oqs-native-mqom/std",
    "oqs-native-ntru/std",
    "oqs-native-ntru-prime/std",
    "oqs-native-slh-dsa/std",
    "oqs-native-uov/std",
    "oqs-native-snova/std",
    "oqs-native-xmss/std",
    "dep:oqs-native-system-random",
]

[lints]
workspace = true

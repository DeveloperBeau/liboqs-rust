[package]
name = "oqs-native"
description = "A native Rust port of liboqs: every algorithm family behind one registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata]
ring = "composition"

[lib]
name = "OQSNative"
path = "src/lib.rs"

[dependencies]
oqs-native-bike = { path = "../BIKE", default-features = false }
oqs-native-domain = { path = "../Domain", default-features = false }
oqs-native-entities = { path = "../Entities", default-features = false }
oqs-native-frodokem = { path = "../FrodoKEM", default-features = false }
oqs-native-hqc = { path = "../HQC", default-features = false }
oqs-native-ml-kem = { path = "../MLKEM", default-features = false }
oqs-native-system-random = { path = "../SystemRandom", optional = true }

[features]
default = ["std"]
# Without `std` the crate builds with `core` and `alloc` only, and has no system random source.
std = [
    "oqs-native-bike/std",
    "oqs-native-domain/std",
    "oqs-native-entities/std",
    "oqs-native-frodokem/std",
    "oqs-native-hqc/std",
    "oqs-native-ml-kem/std",
    "dep:oqs-native-system-random",
]

[lints]
workspace = true

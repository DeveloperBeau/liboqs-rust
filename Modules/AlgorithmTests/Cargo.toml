[package]
name = "oqs-native-algorithm-tests"
description = "Test support for the algorithm families: the liboqs known-answer procedures and digests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Test-only: the family crates use it in their tests.
publish = false

[package.metadata]
ring = "infrastructure"

[lib]
name = "OQSNativeAlgorithmTests"
path = "src/lib.rs"

[dependencies]
oqs-native-domain = { workspace = true }
oqs-native-entities = { workspace = true }
oqs-native-kat-random = { workspace = true }
oqs-native-sha2 = { workspace = true }
oqs-native-sha3 = { workspace = true }

[dev-dependencies]
# The behavior tests of the stateful programs run them on the C schemes, as the harness tests
# of the parity crate do.
oqs-native-c-oracle = { path = "../COracle" }

[features]
default = ["std"]
# Without `std` the crate builds with `core` and `alloc` only.
std = [
    "oqs-native-domain/std",
    "oqs-native-entities/std",
    "oqs-native-kat-random/std",
    "oqs-native-sha2/std",
    "oqs-native-sha3/std",
]

[lints]
workspace = true

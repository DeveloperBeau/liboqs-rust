[package]
name = "oqs-native-sha2"
description = "The SHA-2 hash functions of FIPS 180-4, with the API that liboqs uses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["sha2", "sha256", "sha512", "hash", "liboqs"]
categories.workspace = true

[package.metadata]
ring = "sharedComponents"

[lib]
name = "OQSNativeSHA2"
path = "src/lib.rs"

[features]
default = ["std"]
# Without `std` the crate builds with `core` only.
std = []

[lints]
workspace = true

[package]
name = "oqs-native-sha3"
description = "SHA-3 hash functions and the SHAKE extendable-output functions, as liboqs uses them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["sha3", "shake", "keccak", "hash", "liboqs"]
categories.workspace = true

[package.metadata]
ring = "sharedComponents"

[lib]
name = "OQSNativeSHA3"
path = "src/lib.rs"

[features]
default = ["std"]
# Without `std` the crate builds with `core` only.
std = []

[lints]
workspace = true

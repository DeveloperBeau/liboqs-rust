[package]
name = "oqs-native-ntru"
description = "NTRU, the NTRU-HPS and NTRU-HRSS key encapsulation mechanisms, a native port of the NTRU algorithms of liboqs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The upstream code of PQClean is in the public domain, so the crate keeps the license of the
# workspace.
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ntru", "kem", "pqc", "post-quantum", "liboqs"]
categories.workspace = true
# The tests use the unpublished test crates, so the package leaves them out.
exclude = ["tests/"]

[package.metadata]
ring = "features"

[lib]
name = "OQSNativeNTRU"
path = "src/lib.rs"

[dependencies]
oqs-native-domain = { workspace = true }
oqs-native-entities = { workspace = true }
oqs-native-sha3 = { workspace = true }
oqs-native-sorting-network = { workspace = true }

[dev-dependencies]
oqs-native-algorithm-tests = { path = "../AlgorithmTests" }
oqs-native-kat-random = { path = "../KATRandom" }

[features]
default = ["std"]
# Without `std` the crate builds with `core` and `alloc` only.
std = [
    "oqs-native-domain/std",
    "oqs-native-entities/std",
    "oqs-native-sha3/std",
    "oqs-native-sorting-network/std",
]

[lints]
workspace = true

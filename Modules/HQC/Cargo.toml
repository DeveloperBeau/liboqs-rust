[package]
name = "oqs-native-hqc"
description = "HQC, the Hamming Quasi-Cyclic key encapsulation mechanism, a native port of the HQC algorithms of liboqs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The upstream code of the HQC team is in the public domain, so the crate keeps the license of
# the workspace.
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["hqc", "kem", "pqc", "post-quantum", "liboqs"]
categories.workspace = true
# The tests use the unpublished test crates, so the package leaves them out.
exclude = ["tests/"]

[package.metadata]
ring = "features"

[lib]
name = "OQSNativeHQC"
path = "src/lib.rs"

[dependencies]
oqs-native-domain = { workspace = true }
oqs-native-entities = { workspace = true }
oqs-native-sha3 = { workspace = true }

[dev-dependencies]
oqs-native-algorithm-tests = { path = "../AlgorithmTests" }
oqs-native-kat-random = { path = "../KATRandom" }

[features]
default = ["std"]
# Without `std` the crate builds with `core` and `alloc` only.
std = ["oqs-native-domain/std", "oqs-native-entities/std", "oqs-native-sha3/std"]

[lints]
workspace = true

[package]
name = "oqs-native-ml-kem"
description = "ML-KEM of FIPS 203, a native port of the ML-KEM algorithms of liboqs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The port is under MIT. mlkem-native is under Apache-2.0 OR ISC OR MIT, and the Kyber reference
# code of pq-crystals is under CC0-1.0 OR Apache-2.0.
license = "MIT AND (Apache-2.0 OR ISC OR MIT) AND (CC0-1.0 OR Apache-2.0)"
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ml-kem", "kyber", "fips203", "post-quantum", "liboqs"]
categories.workspace = true
# The tests use the unpublished test crates, so the package leaves them out.
exclude = ["tests/"]

[package.metadata]
ring = "features"

[lib]
name = "OQSNativeMLKEM"
path = "src/lib.rs"

[dependencies]
oqs-native-domain = { workspace = true }
oqs-native-entities = { workspace = true }
oqs-native-sha3 = { workspace = true }

[dev-dependencies]
oqs-native-algorithm-tests = { path = "../AlgorithmTests" }
oqs-native-kat-random = { path = "../KATRandom" }

[features]
default = ["std"]
# Without `std` the crate builds with `core` and `alloc` only.
std = ["oqs-native-domain/std", "oqs-native-entities/std", "oqs-native-sha3/std"]

[lints]
workspace = true
